type Profile {
  userName: String!
  stash: [Item!]
}

type Item {
  id: String!
  quantity: Int!
}

type Query {
  healthCheck: Boolean
  profile: Profile
  userExists(userName: String!): Boolean
  totalPlayers: Int
}

type Mutation {
  createProfile(userName: String!): Profile
  updateProfile(userName: String!): Profile
  deleteProfile: Boolean
}
